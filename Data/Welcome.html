<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UiPath Dispatcher Welcome</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            width: 450px;
            transition: all 0.5s ease;
        }
        h1 { margin-bottom: 20px; font-weight: 300; letter-spacing: 2px; color: #00d2ff; }
        .option-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            text-align: left;
            position: relative;
        }
        .option-card:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.02);
            border-color: #00d2ff;
        }
        .option-card strong { display: block; font-size: 1.1em; margin-bottom: 5px; }
        .option-card span { font-size: 0.85em; opacity: 0.8; }

        #manualInputSection {
            display: none;
            margin-top: 20px;
            text-align: left;
            animation: fadeIn 0.5s;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: white;
            padding: 10px;
            margin-top: 10px;
            resize: none;
            box-sizing: border-box;
        }
        .btn-confirm {
            background: #00d2ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn-back {
            background: none;
            border: none;
            color: #ddd;
            font-size: 0.8em;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <h1>RECRUITMENT</h1>
        <div id="welcomeSection">
            <p>Select your dispatch mode:</p>
            
            <div class="option-card" onclick="showManualInput()">
                <strong>Manual Mode</strong>
                <span>Enter specific emails manually</span>
            </div>
            
            <div class="option-card" onclick="submitMode('Auto')">
                <strong>Drive Auto Mode</strong>
                <span>Process full list from Google Drive</span>
            </div>
        </div>

        <div id="manualInputSection">
            <strong>Enter Recipient Emails:</strong><br>
            <span>Separated by semicolon (;) or comma (,)</span>
            <textarea id="emailList" placeholder="example1@gmail.com; example2@gmail.com..."></textarea>
            <button class="btn-confirm" onclick="submitManual()">Confirm & Proceed</button>
            <center><button class="btn-back" onclick="hideManualInput()">Go Back</button></center>
        </div>
    </div>

    <script>
        function showManualInput() {
            document.getElementById('welcomeSection').style.display = 'none';
            document.getElementById('manualInputSection').style.display = 'block';
        }

        function hideManualInput() {
            document.getElementById('welcomeSection').style.display = 'block';
            document.getElementById('manualInputSection').style.display = 'none';
        }

        function submitMode(mode) {
            const result = {
                "mode": mode,
                "emails": ""
            };
            window.external.setResult(JSON.stringify(result));
        }

        function submitManual() {
            const emails = document.getElementById('emailList').value;
            if(!emails.trim()) {
                alert("Please enter at least one email.");
                return;
            }
            const result = {
                "mode": "Manual",
                "emails": emails
            };
            window.external.setResult(JSON.stringify(result));
        }
    </script>
</body>
</html>
