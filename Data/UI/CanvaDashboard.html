<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Posting</title>
    <script>
        (function () {
            function forceMaximize() {
                try {
                    window.moveTo(0, 0);
                    window.resizeTo(screen.availWidth, screen.availHeight);
                    if (window.outerWidth < screen.availWidth - 30 || window.outerHeight < screen.availHeight - 30) {
                        window.moveTo(0, 0);
                        window.resizeTo(screen.width, screen.height);
                    }
                } catch (e) { }
            }
            window.addEventListener('load', function () {
                setTimeout(forceMaximize, 50);
                setTimeout(forceMaximize, 300);
            });
        })();
    </script>
    <style>
        @font-face {
            font-family: 'BR Omega';
            src: url('../Fonts/BROmega-Regular-BF6556cee4dd400.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'BR Omega';
            src: url('../Fonts/BROmega-Bold-BF6556cee4cf0f3.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }
        :root { 
            --primary: #ffd700; 
            --primary-hover: #ffc400; 
            --bg: #90c2d1; 
            --card: #fff; 
            --text: #111827; 
            --muted: #334155; 
            --border: #cbd5e1; 
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'BR Omega', 'Segoe UI', Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            width: 100%; 
            max-width: 820px; 
            background: var(--card); 
            border: 8px solid #fff; 
            border-radius: 24px; 
            padding: 32px; 
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { 
            margin: 0; 
            font-size: 44px; 
            font-weight: 900; 
            letter-spacing: -1px; 
            text-transform: uppercase; 
            color: #0f172a; 
        }
        .section { margin-bottom: 22px; }
        .section-title { 
            font-size: 13px; 
            text-transform: uppercase; 
            letter-spacing: .08em; 
            font-weight: 700; 
            color: var(--muted); 
            margin-bottom: 10px; 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }
        .section-title span.num { 
            width: 22px; 
            height: 22px; 
            border-radius: 6px; 
            background: #e2e8f0; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            color: #0f172a; 
            font-size: 12px; 
        }
        .section-count {
            margin-left: auto;
            background: var(--primary);
            color: #000;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            color: #000;
        }
        
        .mode-options { 
            display: flex; 
            gap: 12px; 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 12px; 
            background: #f8fafc; 
        }
        .mode-card { 
            flex: 1; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            padding: 16px; 
            background: #fff; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .mode-card.active { 
            border-color: var(--primary); 
            background: #eff6ff; 
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.15); 
        }
        .mode-card strong { display: block; font-size: 20px; margin-bottom: 4px; }
        .mode-card small { color: var(--muted); font-size: 12px; }

        .job-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 10px; 
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            background: #f8fafc;
            max-height: 250px;
            overflow-y: auto;
        }
        .job-item { 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            background: #fff; 
            padding: 12px 14px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            cursor: pointer; 
            transition: all 0.1s;
        }
        .job-item.selected { border-color: var(--primary); background: #eff6ff; }
        .job-item input { width: 20px; height: 20px; accent-color: var(--primary); }

        textarea { 
            width: 100%; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            padding: 12px; 
            font-size: 15px; 
            font-family: inherit; 
            background: #fff; 
        }
        textarea:focus { outline: none; border-color: var(--primary); }

        /* Custom dropdown (avoids native Win32 combo-box popup that breaks window polling) */
        .cdd-wrap { position: relative; }
        .cdd-trigger {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            font-family: inherit;
            background: #fff;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            color: #111827;
        }
        .cdd-trigger:focus, .cdd-wrap.open .cdd-trigger { outline: none; border-color: var(--primary); }
        .cdd-arrow { font-size: 12px; color: #64748b; margin-left: 8px; transition: transform .15s ease; }
        .cdd-wrap.open .cdd-arrow { transform: rotate(180deg); }
        .cdd-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 6px 18px rgba(0,0,0,.10);
            display: none;
        }
        .cdd-wrap.open.upward .cdd-list {
            top: auto;
            bottom: calc(100% + 4px);
        }
        .cdd-wrap.open .cdd-list { display: block; }
        .cdd-option {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #f1f5f9;
            user-select: none;
        }
        .cdd-option:last-child { border-bottom: none; }
        .cdd-option:hover, .cdd-option.active { background: #eff6ff; }
        .cdd-option.placeholder { color: #64748b; }

        .footer { 
            margin-top: 24px; 
            border-top: 1px solid var(--border); 
            padding-top: 18px; 
            display: flex; 
            justify-content: space-between; 
            gap: 10px; 
        }
        .btn { 
            border: none; 
            border-radius: 999px; 
            padding: 12px 24px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .btn-cancel { background: #e2e8f0; color: #334155; }
        .btn-continue { background: var(--primary); color: #000; flex-grow: 1; }
        .btn-continue:hover { background: var(--primary-hover); transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>Job Posting</h1></div>

        <div class="section">
            <div class="section-title"><span class="num">1</span>Operational Mode</div>
            <div class="mode-options">
                <div class="mode-card active" id="modeAuto" onclick="setMode('Auto')">
                    <strong>List Import</strong><small>Recruitment Lead Email.xlsx</small>
                </div>
                <div class="mode-card" id="modeManual" onclick="setMode('Manual')">
                    <strong>Email Entry</strong><small>Type Recipient Emails</small>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <span class="num">2</span>Select Job Vacancies
                <span class="section-count" id="countDisplay">0 SELECTED</span>
            </div>
            <div class="job-grid" id="jobGrid">
                <!-- Populated via JS -->
            </div>
        </div>

        <div class="section">
            <div class="section-title"><span class="num">3</span>Configuration</div>
            <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:15px; margin-bottom:15px;">
                <div>
                    <label style="font-size:11px; font-weight:800; color:#64748b; text-transform:uppercase; margin-bottom:6px; display:block;">Select Poster Template</label>
                    <div class="cdd-wrap" id="templateSelect" data-value="">
                        <button type="button" class="cdd-trigger" id="cddTrigger">
                            <span id="cddDisplay">-- Choose Template --</span>
                            <span class="cdd-arrow">&#9662;</span>
                        </button>
                        <div class="cdd-list" id="cddList"></div>
                    </div>
                </div>
                <div id="emailContainer" style="display:none;">
                    <label for="targetEmails" style="font-size:11px; font-weight:800; color:#64748b; text-transform:uppercase; margin-bottom:6px; display:block;">Recipient Emails</label>
                    <textarea id="targetEmails" style="height:44px; padding:8px; font-size:13px;" placeholder="alice@company.com; bob@company.com"></textarea>
                    <div style="font-size:11px; color:#64748b; margin-top:4px;">Separate multiple emails with a semicolon <code style="background:#f1f5f9; padding:1px 5px; border-radius:4px;">;</code></div>
                    <div id="emailError" style="display:none; font-size:11px; color:#dc2626; margin-top:4px;"></div>
                </div>
            </div>
            <div id="modeHint" style="font-size:11px; color:#64748b; font-style:italic;">
                * System will automatically filter templates based on job count.
            </div>
        </div>

        <div class="footer">
            <button class="btn btn-cancel" onclick="cancelFlow()">Cancel</button>
            <button class="btn btn-continue" onclick="finish(true)">Continue & Generate</button>
        </div>
    </div>

    <script>
        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        const SESSION_ID = getQueryParam('session') || 'default';
        document.title = "CANVA_DASHBOARD::" + SESSION_ID;
        let isFinishing = false;

        // Custom dropdown helper (replaces native <select> to avoid OS-level popup
        // that breaks Process.MainWindowHandle/Title polling).
        const CDD = {
            options: [],
            get value() {
                return document.getElementById('templateSelect').getAttribute('data-value') || '';
            },
            set value(v) {
                document.getElementById('templateSelect').setAttribute('data-value', v || '');
            },
            setOptions(opts, placeholderText) {
                this.options = opts.slice();
                const list = document.getElementById('cddList');
                list.innerHTML = '';
                const placeholder = { value: '', text: placeholderText || '-- Choose Template --', placeholder: true };
                [placeholder].concat(opts).forEach(o => {
                    const row = document.createElement('div');
                    row.className = 'cdd-option' + (o.placeholder ? ' placeholder' : '');
                    row.textContent = o.text;
                    row.setAttribute('data-val', o.value);
                    row.addEventListener('click', (ev) => {
                        ev.stopPropagation();
                        CDD.select(o.value, o.text);
                    });
                    list.appendChild(row);
                });
                // Preserve current selection if still available; otherwise reset.
                const current = this.value;
                const stillValid = opts.some(o => o.value === current);
                if (!stillValid) {
                    this.select('', placeholder.text);
                } else {
                    // Refresh display text in case title changed
                    const match = opts.find(o => o.value === current);
                    if (match) this.select(match.value, match.text);
                }
            },
            select(v, t) {
                this.value = v;
                document.getElementById('cddDisplay').textContent = t;
                this.close();
                // Mark active item
                document.querySelectorAll('#cddList .cdd-option').forEach(el => {
                    el.classList.toggle('active', el.getAttribute('data-val') === v);
                });
            },
            open() {
                const wrap = document.getElementById('templateSelect');
                const list = document.getElementById('cddList');
                if (!wrap || !list) return;

                // Decide dropdown direction by available viewport space.
                wrap.classList.remove('upward');
                wrap.classList.add('open');
                const rect = wrap.getBoundingClientRect();
                const listHeight = Math.min(list.scrollHeight || 0, 220);
                const gap = 8;
                const spaceBelow = window.innerHeight - rect.bottom;
                const spaceAbove = rect.top;
                if (spaceBelow < listHeight + gap && spaceAbove > spaceBelow) {
                    wrap.classList.add('upward');
                }
            },
            close() {
                const wrap = document.getElementById('templateSelect');
                if (!wrap) return;
                wrap.classList.remove('open');
                wrap.classList.remove('upward');
            },
            toggle() {
                const w = document.getElementById('templateSelect');
                if (w.classList.contains('open')) this.close();
                else this.open();
            }
        };

        function warnBeforeClose(event) {
            if (isFinishing) return;
            event.preventDefault();
            event.returnValue = " ";
            return " ";
        }

        window.onbeforeunload = warnBeforeClose;
        window.addEventListener("beforeunload", warnBeforeClose);

        let currentMode = 'Auto';
        let jobOptions = [];
        let templateOptions = []; // {id, title, group}
        let lastTargetTag = '';

        // Data from Robot injection: global_jobs, global_templates
        
        function init() {
            // Load Jobs
            const jobsRaw = typeof global_jobs !== 'undefined' ? global_jobs : (getQueryParam('jobs') || '');
            if (jobsRaw) {
                jobOptions = jobsRaw.split(';').filter(x => x && x.trim());
                renderJobs();
            }

            // Load Templates from format "id|title|group;id|title|group"
            const tplRaw = typeof global_templates !== 'undefined' ? global_templates : (getQueryParam('templates') || '');
            if (tplRaw) {
                tplRaw.split(';').forEach(entry => {
                    const parts = entry.split('|');
                    if (parts.length >= 2 && parts[0]) {
                        let title = parts[1] || 'Untitled';
                        try { title = decodeURIComponent(title); } catch (e) {}
                        const rawGroup = parts.length >= 3 ? (parts[2] || '') : '';
                        const inferredGroup = normalizeTemplateGroup(rawGroup || title);
                        templateOptions.push({ id: parts[0], title: title, group: inferredGroup });
                    }
                });
            }
            updateUI('init'); // Initial count and filter
        }

        function normalizeTemplateGroup(text) {
            const t = (text || '').toUpperCase().replace(/\s+/g, '_');
            if (t.startsWith('G_') || t.startsWith('GROUP_')) return 'GROUP';
            if (t.startsWith('I_') || t.startsWith('INDIVIDUAL_') || t.startsWith('INVIDUAL_')) return 'INDIVIDUAL';
            if (t.includes('GROUP_TEMPLATE') || t.includes('GROUP')) return 'GROUP';
            if (t.includes('INVIDUAL_TEMPLATE') || t.includes('INDIVIDUAL_TEMPLATE') || t.includes('INDIVIDUAL') || t.includes('SINGLE')) return 'INDIVIDUAL';
            return '';
        }

        function renderJobs() {
            const grid = document.getElementById('jobGrid');
            grid.innerHTML = '';
            jobOptions.forEach((job, i) => {
                const item = document.createElement('div');
                item.className = 'job-item';
                item.onclick = (e) => {
                    if (e.target.tagName !== 'INPUT') toggleJob(i);
                };
                item.innerHTML = `<input type="checkbox" name="jobId" value="${job}" id="job_${i}" onchange="onJobCheckboxChange(${i})"> <label>${job}</label>`;
                grid.appendChild(item);
            });
        }

        function onJobCheckboxChange(idx) {
            const cb = document.getElementById('job_' + idx);
            const isAll = cb && cb.value && cb.value.toUpperCase() === 'ALL';
            updateUI(isAll ? 'all_toggle' : 'job_toggle');
        }

        function toggleJob(idx) {
            const cb = document.getElementById('job_' + idx);
            cb.checked = !cb.checked;
            onJobCheckboxChange(idx);
        }

        function setAllJobs(checked) {
            const checks = document.getElementsByName('jobId');
            for (let c of checks) {
                if (c.value.toUpperCase() !== 'ALL') c.checked = checked;
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeAuto').className = mode === 'Auto' ? 'mode-card active' : 'mode-card';
            document.getElementById('modeManual').className = mode === 'Manual' ? 'mode-card active' : 'mode-card';
            document.getElementById('emailContainer').style.display = mode === 'Manual' ? 'block' : 'none';
            if (mode !== 'Manual') clearEmailError();
        }

        function showEmailError(message) {
            const el = document.getElementById('emailError');
            if (!el) return;
            el.innerText = message || 'Invalid email format.';
            el.style.display = 'block';
        }

        function clearEmailError() {
            const el = document.getElementById('emailError');
            if (!el) return;
            el.innerText = '';
            el.style.display = 'none';
        }

        function validateManualEmails(raw) {
            const text = (raw || '').trim();
            if (!text) return { ok: false, message: 'Please enter at least one email.' };
            const parts = text.split(/[;,]/).map(x => x.trim()).filter(Boolean);
            if (parts.length === 0) return { ok: false, message: 'Please enter at least one email.' };
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const invalid = parts.find(e => !re.test(e));
            if (invalid) return { ok: false, message: 'Invalid email format: ' + invalid };
            return { ok: true, message: '' };
        }

        function updateUI(trigger) {
            const checks = document.getElementsByName('jobId');
            let allCb = null;
            const individual = [];

            for (let c of checks) {
                if (c.value.toUpperCase() === 'ALL') {
                    allCb = c;
                } else {
                    individual.push(c);
                }
            }

            if (allCb && trigger === 'all_toggle') {
                setAllJobs(allCb.checked);
            }

            if (allCb && trigger !== 'all_toggle') {
                const allChecked = individual.length > 0 && individual.every(c => c.checked);
                allCb.checked = allChecked;
            }

            const count = individual.filter(c => c.checked).length;
            
            for (let c of checks) {
                if(c.parentNode) c.parentNode.className = c.checked ? 'job-item selected' : 'job-item';
            }

            document.getElementById('countDisplay').innerText = count + " SELECTED";

            const targetTag = count >= 2 ? "GROUP" : "INDIVIDUAL";
            
            // Optimization: Skip DOM rebuild if template list doesn't need to change
            if (targetTag === lastTargetTag && trigger !== 'init') return;
            
            // Re-check: only update if options are truly different or first time
            lastTargetTag = targetTag;

            // Filter Templates
            const preferred = [];
            const fallbackByUnknown = [];

            templateOptions.forEach(tpl => {
                const t = (tpl.title || '').toUpperCase();
                const isGroup = tpl.group === 'GROUP' || t.includes("GROUP");
                const isIndividual = tpl.group === 'INDIVIDUAL' || t.includes("INDIVIDUAL") || t.includes("INVIDUAL") || t.includes("SINGLE");
                
                let show = false;
                if (count >= 2) {
                    show = isGroup;
                } else {
                    show = isIndividual;
                }

                if (show) preferred.push(tpl);
                else if (!isGroup && !isIndividual) fallbackByUnknown.push(tpl);
            });

            const finalList = preferred.length > 0 ? preferred : (fallbackByUnknown.length > 0 ? fallbackByUnknown : templateOptions);

            const cddOpts = finalList.map(tpl => ({ value: tpl.id, text: tpl.title }));
            CDD.setOptions(cddOpts, '-- Choose ' + targetTag + ' Template --');

            const modeHint = document.getElementById('modeHint');
            if (templateOptions.length === 0) {
                modeHint.innerText = "* No templates found.";
            } else if (preferred.length === 0) {
                modeHint.innerText = "* No exact " + targetTag + " match. Showing all available templates.";
            } else {
                modeHint.innerText = "* System is filtering templates for " + targetTag + " mode.";
            }
        }

        // Write the same marker to the clipboard. The robot polls both window-title
        // and clipboard, so it can still pick up the result even when Teams screen
        // sharing / focus changes break Process.MainWindowTitle detection.
        function writeResultToClipboard(marker) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(marker).catch(function(e){ console.warn('clipboard write failed', e); });
                } else {
                    // Legacy fallback: textarea + execCommand('copy').
                    const ta = document.createElement('textarea');
                    ta.value = marker;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.focus(); ta.select();
                    try { document.execCommand('copy'); } catch (_) {}
                    document.body.removeChild(ta);
                }
            } catch (e) { console.warn('clipboard write exception', e); }
        }

        // Best-effort self-close. Edge --app windows allow window.close() in most
        // cases. We also strip beforeunload handlers so no confirm dialog blocks.
        function selfCloseSoon(delayMs) {
            setTimeout(function () {
                try { window.onbeforeunload = null; } catch (_) {}
                try { window.removeEventListener('beforeunload', warnBeforeClose); } catch (_) {}
                try { window.close(); } catch (_) {}
                // Fallback: blank out the page so even if close is denied the user
                // sees a clear "done" state instead of the same dashboard.
                setTimeout(function () {
                    try {
                        document.body.innerHTML =
                            '<div style="font-family:sans-serif;padding:40px;text-align:center;color:#444">' +
                            '<h2>Submitted. You can close this window.</h2>' +
                            '<p>The robot has received your selection and is continuing the process.</p>' +
                            '</div>';
                    } catch (_) {}
                }, 800);
            }, delayMs);
        }

        function finish(success) {
            if (!success) {
                isFinishing = true;
                const marker = "CANVA_RESULT::" + SESSION_ID + "::CANCEL";
                writeResultToClipboard(marker);
                document.title = "RESULT::" + SESSION_ID + "::CANCEL";
                selfCloseSoon(3500);
                return;
            }

            const templateId = CDD.value;
            const hint = document.getElementById('modeHint');
            if (!templateId) {
                hint.style.color = 'red';
                hint.innerText = "Error: Please select a template.";
                return;
            }

            const targetEmails = currentMode === 'Manual' ? document.getElementById('targetEmails').value : "";
            if (currentMode === 'Manual') {
                const check = validateManualEmails(targetEmails);
                if (!check.ok) {
                    showEmailError(check.message);
                    return;
                }
                clearEmailError();
            }
            
            const selected = [];
            const checks = document.getElementsByName('jobId');
            for(let c of checks) if(c.checked) selected.push(c.value);

            if (selected.length === 0) {
                hint.style.color = 'red';
                hint.innerText = "Error: Please select at least one job.";
                return;
            }
            
            isFinishing = true;
            const result = JSON.stringify({
                t: templateId,
                e: targetEmails,
                j: selected.join(';')
            });

            const encoded = encodeURIComponent(result);
            const marker = "CANVA_RESULT::" + SESSION_ID + "::" + encoded;
            writeResultToClipboard(marker);
            document.title = "RESULT::" + SESSION_ID + "::" + encoded;
            // Give the robot time to pick the result up before auto-close.
            selfCloseSoon(3500);
        }

        function cancelFlow() {
            const confirmed = confirm("You chose Cancel. The workflow will stop now. Are you sure?");
            if (confirmed) {
                finish(false);
            }
        }

        // Wire up custom dropdown trigger + outside-click close.
        document.addEventListener('click', (ev) => {
            const wrap = document.getElementById('templateSelect');
            if (!wrap) return;
            const trigger = document.getElementById('cddTrigger');
            if (trigger && trigger.contains(ev.target)) {
                ev.stopPropagation();
                CDD.toggle();
                return;
            }
            if (!wrap.contains(ev.target)) {
                CDD.close();
            }
        });

        // Initialize once DOM is ready AND the sidecar data script has loaded (or errored).
        let __domReady = false, __dataReady = false;
        function __tryInit() {
            if (__domReady && __dataReady) init();
        }
        document.addEventListener('DOMContentLoaded', () => {
            __domReady = true;
            const emailInput = document.getElementById('targetEmails');
            if (emailInput) emailInput.addEventListener('input', clearEmailError);
            __tryInit();
        });

        (function loadDataScript() {
            // Sidecar file is rewritten by the robot right before every launch.
            // Cache-bust with session + timestamp so we never read a stale copy.
            const sess = getQueryParam('session') || ('t' + Date.now());
            const s = document.createElement('script');
