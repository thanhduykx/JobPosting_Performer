<!DOCTYPE html>
<!-- saved from url=(0014)about:internet -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Delivery Status Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'BR Omega';
            src: url('Fonts/BROmega-Regular-BF6556cee4dd400.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'BR Omega';
            src: url('Fonts/BROmega-Medium-BF6556cee4bc2e2.otf') format('opentype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'BR Omega';
            src: url('Fonts/BROmega-Bold-BF6556cee4cf0f3.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }
        
        :root {
            --success: #10b981;
            --success-bg: #d1fae5;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --warning: #f59e0b;
            --warning-bg: #fef3c7;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'BR Omega', 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 4px solid;
        }
        
        .stat-card.success { border-left-color: var(--success); }
        .stat-card.error { border-left-color: var(--error); }
        .stat-card.total { border-left-color: #3b82f6; }
        
        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--text);
        }
        
        .filters {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .filter-label {
            font-weight: 600;
            color: var(--text);
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .search-box {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .table-container {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: #f8fafc;
        }
        
        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border);
        }
        
        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        
        tbody tr {
            transition: background 0.2s;
        }
        
        tbody tr:hover {
            background: #f8fafc;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-success {
            background: var(--success-bg);
            color: var(--success);
        }
        
        .status-failed {
            background: var(--error-bg);
            color: var(--error);
        }
        
        .email-cell {
            font-weight: 500;
            color: var(--text);
        }
        
        .reason-cell {
            color: var(--text-muted);
            font-size: 14px;
            max-width: 400px;
        }
        
        .time-cell {
            color: var(--text-muted);
            font-size: 13px;
            white-space: nowrap;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Email Delivery Status Report</h1>
            <p id="reportTime">Generated on: <span id="timestamp"></span></p>
        </div>
        
        <div class="stats">
            <div class="stat-card total">
                <div class="stat-label">Total Emails</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card success">
                <div class="stat-label">✓ Delivered</div>
                <div class="stat-value" id="successCount">0</div>
            </div>
            <div class="stat-card error">
                <div class="stat-label">✗ Failed</div>
                <div class="stat-value" id="failedCount">0</div>
            </div>
        </div>
        
        <div class="filters">
            <span class="filter-label">Filter:</span>
            <button class="filter-btn active" onclick="filterStatus('all')">All</button>
            <button class="filter-btn" onclick="filterStatus('success')">Delivered</button>
            <button class="filter-btn" onclick="filterStatus('failed')">Failed</button>
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search by email address..." onkeyup="searchEmails()">
        </div>
        
        <div class="table-container">
            <table id="emailTable">
                <thead>
                    <tr>
                        <th>Recipient Email</th>
                        <th>Status</th>
                        <th>Reason / Details</th>
                        <th>Received Time</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4" class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                            <div>No email delivery data available</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="footer">
            <p>FPT Software - Email Delivery Monitoring System</p>
        </div>
    </div>
    
    <script src="email_status_data.js"></script>
    <script>
        var allData = [];
        var currentFilter = 'all';
        
        // Set timestamp
        document.getElementById('timestamp').textContent = new Date().toLocaleString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
        
        // Load data from external JS file
        function loadData() {
            if (typeof emailStatusData !== 'undefined') {
                allData = emailStatusData;
                updateStats();
                renderTable(allData);
            }
        }
        
        function updateStats() {
            var total = allData.length;
            var success = allData.filter(function(item) { return item.status === 'success'; }).length;
            var failed = total - success;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('successCount').textContent = success;
            document.getElementById('failedCount').textContent = failed;
        }
        
        function filterStatus(status) {
            currentFilter = status;
            
            // Update button states
            var buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Filter data
            var filtered = allData;
            if (status === 'success') {
                filtered = allData.filter(function(item) { return item.status === 'success'; });
            } else if (status === 'failed') {
                filtered = allData.filter(function(item) { return item.status === 'failed'; });
            }
            
            renderTable(filtered);
        }
        
        function searchEmails() {
            var searchTerm = document.getElementById('searchBox').value.toLowerCase();
            var filtered = allData.filter(function(item) {
                return item.email.toLowerCase().indexOf(searchTerm) !== -1;
            });
            
            // Apply status filter
            if (currentFilter === 'success') {
                filtered = filtered.filter(function(item) { return item.status === 'success'; });
            } else if (currentFilter === 'failed') {
                filtered = filtered.filter(function(item) { return item.status === 'failed'; });
            }
            
            renderTable(filtered);
        }
        
        function renderTable(data) {
            var tbody = document.getElementById('tableBody');
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg><div>No emails match your filter</div></td></tr>';
                return;
            }
            
            var html = '';
            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                var statusClass = item.status === 'success' ? 'status-success' : 'status-failed';
                var statusText = item.status === 'success' ? '✓ Delivered' : '✗ Failed';
                
                html += '<tr>' +
                    '<td class="email-cell">' + item.email + '</td>' +
                    '<td><span class="status-badge ' + statusClass + '">' + statusText + '</span></td>' +
                    '<td class="reason-cell">' + (item.reason || '-') + '</td>' +
                    '<td class="time-cell">' + item.time + '</td>' +
                    '</tr>';
            }
            
            tbody.innerHTML = html;
        }
        
        // Load data on page load
        window.onload = loadData;
    </script>
</body>
</html>
