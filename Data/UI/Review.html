<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Review</title>
  <style>
    :root { --primary:#ffd700; --primary-hover:#ffc400; --bg:#90c2d1; --card:#fff; --text:#111827; --muted:#334155; --border:#cbd5e1; }
    * { box-sizing:border-box; }
    body { margin:0; padding:20px; font-family:Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; }
    .container { width:100%; max-width:820px; background:#fff; border:8px solid #fff; border-radius:24px; padding:30px; }
    h1 { margin:0 0 20px; font-size:40px; font-weight:900; letter-spacing:-1px; text-transform:uppercase; color:#0f172a; }
    .summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px; }
    .summary-item { background:#f8fafc; border:1px solid var(--border); border-radius:10px; padding:12px; }
    .summary-label { font-size:11px; text-transform:uppercase; font-weight:700; color:var(--muted); margin-bottom:4px; }
    .summary-value { font-size:14px; font-weight:600; word-break:break-word; }
    .recipient-title { margin:0 0 10px; font-size:16px; font-weight:700; color:var(--muted); }
    .list-container { border:1px solid var(--border); border-radius:10px; overflow:auto; max-height:340px; margin-bottom:18px; background:#fff; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; padding:10px 12px; background:#f8fafc; border-bottom:1px solid var(--border); color:var(--muted); font-size:12px; position:sticky; top:0; }
    td { padding:10px 12px; border-bottom:1px solid #f1f5f9; font-size:14px; }
    tr:last-child td { border-bottom:none; }
    .actions { display:flex; gap:10px; justify-content:flex-end; }
    button { border:none; border-radius:999px; padding:11px 18px; font-size:14px; font-weight:700; cursor:pointer; }
    .btn-cancel { background:#e2e8f0; color:#334155; }
    .btn-preview { background:#dbeafe; color:#1d4ed8; }
    .btn-send { background:var(--primary); color:#000; flex-grow:1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Review</h1>

    <div class="summary-grid">
      <div class="summary-item"><div class="summary-label">Jobs Selected</div><div class="summary-value" id="summaryJobs">-</div></div>
      <div class="summary-item"><div class="summary-label">Template</div><div class="summary-value" id="summaryTemplate">-</div></div>
      <div class="summary-item"><div class="summary-label">Recipients</div><div class="summary-value" id="summaryCount">0</div></div>
    </div>

    <div class="recipient-title">Mailing List</div>
    <div class="list-container">
      <table>
        <thead><tr><th width="40">#</th><th>Name</th><th>Email Address</th></tr></thead>
        <tbody id="recipientBody"></tbody>
      </table>
    </div>

    <div class="actions">
      <button class="btn-cancel" onclick="finish(false)">Cancel</button>
      <button class="btn-preview" onclick="openPdfPreview()">Preview PDF</button>
      <button class="btn-send" onclick="finish(true)">Confirm & Send</button>
    </div>
  </div>

  <div id="pdfModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;justify-content:center;align-items:center;">
    <div style="background:#fff;width:90%;height:90%;max-width:1200px;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;">
      <div style="padding:12px 16px;background:#f8fafc;border-bottom:1px solid #cbd5e1;display:flex;justify-content:space-between;align-items:center;">
        <strong>PDF Preview</strong>
        <button class="btn-cancel" style="background:#ef4444;color:#fff;padding:8px 12px;border-radius:6px;" onclick="closePdfPreview()">Close Preview</button>
      </div>
      <iframe id="pdfFrame" src="about:blank" style="width:100%;height:100%;border:none;"></iframe>
    </div>
  </div>

  <script src="review_data.js"></script>
  <script>
    function getQueryParam(name) {
      var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.href);
      if (!m) return null;
      return decodeURIComponent((m[1] || '').replace(/\+/g, ' '));
    }

    var SESSION_TOKEN = getQueryParam('session') || 'default';
    var TITLE_MARKER = 'PR::' + SESSION_TOKEN;
    document.title = 'Portal Review | ' + TITLE_MARKER;
    try {
      window.moveTo(0, 0);
      window.resizeTo(screen.availWidth, screen.availHeight);
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, 'Portal Review', window.location.pathname + window.location.search);
      }
    } catch (e) {}

    var jobs = (typeof global_jobs !== 'undefined' ? global_jobs : (getQueryParam('jobs') || 'None'));
    var template = (typeof global_template !== 'undefined' ? global_template : (getQueryParam('template') || 'None'));
    var employeesRaw = (typeof global_employees !== 'undefined' ? global_employees : (getQueryParam('employees') || getQueryParam('candidates') || ''));

    document.getElementById('summaryJobs').innerText = jobs.replace(/;/g, ', ');
    document.getElementById('summaryTemplate').innerText = template;

    var rows = employeesRaw ? employeesRaw.split(';') : [];
    document.getElementById('summaryCount').innerText = rows.filter(function(x){ return x && x.trim(); }).length;

    var tbody = document.getElementById('recipientBody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:30px;color:#64748b;">No recipients found.</td></tr>';
    } else {
      for (var i = 0; i < rows.length; i++) {
        var entry = (rows[i] || '').trim();
        if (!entry) continue;
        var name = entry;
        var email = '';
        if (entry.indexOf('<') !== -1) {
          var parts = entry.split('<');
          name = (parts[0] || '').replace('•', '').trim();
          email = (parts[1] || '').replace('>', '').trim();
        }
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + (i + 1) + '</td><td><strong>' + name + '</strong></td><td><code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;">' + email + '</code></td>';
        tbody.appendChild(tr);
      }
    }

    function openPdfPreview() {
      var p = (typeof global_pdf_path !== 'undefined' ? 'file:///' + global_pdf_path : '../Input/Job_Description.pdf');
      document.getElementById('pdfModal').style.display = 'flex';
      document.getElementById('pdfFrame').src = p;
    }

    function closePdfPreview() {
      document.getElementById('pdfModal').style.display = 'none';
      document.getElementById('pdfFrame').src = 'about:blank';
    }

    function emitResult(value) {
      document.title = 'RESULT::' + SESSION_TOKEN + '::' + value;
    }

    function finish(confirmed) {
      closePdfPreview();
      var result = confirmed ? 'Yes' : 'No';
      try {
        if (window.external && typeof window.external.setResult !== 'undefined') return window.external.setResult(result);
        if (window.uipath && typeof window.uipath.setResult !== 'undefined') return window.uipath.setResult(result);
      } catch (e) {}
      emitResult(result);
    }
  </script>
</body>
</html>
