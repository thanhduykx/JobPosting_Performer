<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Dashboard</title>
  <style>
    :root { --primary:#ffd700; --primary-hover:#ffc400; --bg:#90c2d1; --card:#fff; --text:#111827; --muted:#334155; --border:#cbd5e1; }
    * { box-sizing:border-box; }
    body { margin:0; padding:20px; font-family:Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; }
    .container { width:100%; max-width:820px; background:var(--card); border:8px solid #fff; border-radius:24px; padding:32px; }
    .header { text-align:center; margin-bottom:24px; }
    .header h1 { margin:0; font-size:44px; font-weight:900; letter-spacing:-1px; text-transform:uppercase; color:#0f172a; }
    .section { margin-bottom:22px; }
    .section-title { font-size:13px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:var(--muted); margin-bottom:10px; display:flex; gap:8px; align-items:center; }
    .section-title span { width:22px; height:22px; border-radius:6px; background:#e2e8f0; display:inline-flex; align-items:center; justify-content:center; color:#0f172a; font-size:12px; }
    .mode-options { display:flex; gap:12px; border:1px solid var(--border); border-radius:12px; padding:12px; background:#f8fafc; }
    .mode-card { flex:1; border:1px solid var(--border); border-radius:10px; padding:16px; background:#fff; text-align:center; cursor:pointer; }
    .mode-card.active { border-color:var(--primary); background:#eff6ff; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
    .mode-card strong { display:block; font-size:20px; margin-bottom:4px; }
    .mode-card small { color:var(--muted); }
    #dynamicContent { border:1px solid var(--border); border-radius:12px; padding:16px; background:#f1f5f9; min-height:200px; }
    .empty-state { text-align:center; color:#64748b; padding-top:56px; }
    .job-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
    .job-item { border:1px solid var(--border); border-radius:10px; background:#fff; padding:12px 14px; display:flex; gap:10px; align-items:center; cursor:pointer; }
    .job-item.selected { border-color:var(--primary); background:#eff6ff; }
    .job-item input { width:20px; height:20px; accent-color:var(--primary); }
    textarea, select { width:100%; border:1px solid var(--border); border-radius:10px; padding:12px; font-size:15px; font-family:inherit; background:#fff; }
    textarea { min-height:140px; resize:vertical; }
    .footer { margin-top:24px; border-top:1px solid var(--border); padding-top:18px; display:flex; justify-content:space-between; gap:10px; }
    .btn { border:none; border-radius:999px; padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer; }
    .btn-cancel { background:#e2e8f0; color:#334155; }
    .btn-continue { background:var(--primary); color:#000; }
    .btn-continue:hover { background:var(--primary-hover); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><h1>Dashboard</h1></div>

    <div class="section">
      <div class="section-title"><span>1</span>Operational Mode</div>
      <div class="mode-options">
        <div class="mode-card" id="modeAuto" onclick="setMode('Auto')"><strong>Automatic</strong><small>Use Google Drive Data</small></div>
        <div class="mode-card" id="modeManual" onclick="setMode('Manual')"><strong>Manual</strong><small>Input Custom Emails</small></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title"><span>2</span><span id="dynamicTitle">Configuration</span></div>
      <div id="dynamicContent"><div class="empty-state">Select a mode to continue configuration...</div></div>
    </div>

    <div class="section">
      <div class="section-title"><span>3</span>Email Template</div>
      <select id="templateSelect"><option value="">-- Choose Campaign Template --</option></select>
    </div>

    <div class="footer">
      <button class="btn btn-cancel" onclick="cancelAction()">Cancel & Exit</button>
      <button class="btn btn-continue" onclick="submit()">Continue</button>
    </div>
  </div>

  <script src="dashboard_data.js"></script>
  <script>
    var currentMode = '';
    var jobOptions = [];
    var templateOptions = [];

    function getQueryParam(name) {
      var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.href);
      if (!m) return null;
      return decodeURIComponent((m[1] || '').replace(/\+/g, ' '));
    }

    var SESSION_TOKEN = getQueryParam('session') || 'default';
    var TITLE_MARKER = 'PD::' + SESSION_TOKEN;
    document.title = 'Portal Dashboard | ' + TITLE_MARKER;
    try {
      window.moveTo(0, 0);
      window.resizeTo(screen.availWidth, screen.availHeight);
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, 'Portal Dashboard', window.location.pathname + window.location.search);
      }
    } catch (e) {}

    var jobsRaw = (typeof global_jobs !== 'undefined' ? global_jobs : getQueryParam('jobs')) || '';
    var templatesRaw = (typeof global_templates !== 'undefined' ? global_templates : getQueryParam('templates')) || '';
    jobsRaw.split(';').forEach(function (x) { if (x && x.trim()) jobOptions.push(x.trim()); });
    templatesRaw.split(';').forEach(function (fullPath) {
      if (!fullPath || !fullPath.trim()) return;
      var parts = fullPath.split(/[\\/]/);
      templateOptions.push({ path: fullPath, name: parts[parts.length - 1], category: parts.length > 1 ? parts[0] : 'Other' });
    });

    function renderJobsHtml() {
      if (!jobOptions.length) return '<div class="empty-state">No job data found.</div>';
      var html = '<div class="job-grid">';
      for (var i = 0; i < jobOptions.length; i++) {
        var job = jobOptions[i];
        var label = (job.toUpperCase() === 'ALL') ? '<strong>' + job + '</strong>' : job;
        html += '<div class="job-item" onclick="toggleCheckbox(' + i + ', event)">' +
          '<input type="checkbox" name="jobId" value="' + job + '" id="job_' + i + '" onchange="onJobChange(event, this)" onclick="event.stopPropagation()">' +
          '<label>' + label + '</label></div>';
      }
      html += '</div>';
      return html;
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeAuto').className = mode === 'Auto' ? 'mode-card active' : 'mode-card';
      document.getElementById('modeManual').className = mode === 'Manual' ? 'mode-card active' : 'mode-card';
      var box = document.getElementById('dynamicContent');
      var title = document.getElementById('dynamicTitle');
      var jobsHtml = renderJobsHtml();
      if (mode === 'Auto') {
        title.innerText = 'Select Job Vacancies';
        box.innerHTML = jobsHtml;
      } else {
        title.innerText = 'Configure Manual Dispatch';
        box.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px;">' +
          '<div><div style="font-weight:700;color:#334155;margin-bottom:8px;">Step A: Select Jobs</div>' + jobsHtml + '</div>' +
          '<div><div style="font-weight:700;color:#334155;margin-bottom:8px;">Step B: Recipient Emails (separated by ;)</div>' +
          '<textarea id="emailList" placeholder="example1@gmail.com; Name <example2@gmail.com>"></textarea></div></div>';
      }
      updateTemplateDropdown();
    }

    function toggleCheckbox(idx, event) {
      var cb = document.getElementById('job_' + idx);
      cb.checked = !cb.checked;
      onJobChange(event, cb);
    }

    function onJobChange(event, cb) {
      cb.parentNode.className = cb.checked ? 'job-item selected' : 'job-item';
      if (cb.value.toUpperCase() === 'ALL' && cb.checked) {
        var all = document.getElementsByName('jobId');
        for (var i = 0; i < all.length; i++) {
          if (all[i].value.toUpperCase() !== 'ALL') {
            all[i].checked = true;
            all[i].parentNode.className = 'job-item selected';
          }
        }
      }
      updateTemplateDropdown();
    }

    function updateTemplateDropdown() {
      var checks = document.getElementsByName('jobId');
      var count = 0, hasAll = false;
      for (var i = 0; i < checks.length; i++) {
        if (checks[i].checked && checks[i].value.toUpperCase() !== 'ALL') count++;
        if (checks[i].checked && checks[i].value.toUpperCase() === 'ALL') hasAll = true;
      }
      if (hasAll && count === 0) count = 2;
      var target = count >= 2 ? 'Group' : 'Individual';
      var ddl = document.getElementById('templateSelect');
      var first = ddl.options[0];
      ddl.innerHTML = '';
      ddl.appendChild(first);
      for (var j = 0; j < templateOptions.length; j++) {
        if ((templateOptions[j].category || '').toLowerCase() === target.toLowerCase()) {
          var opt = document.createElement('option');
          opt.value = templateOptions[j].path;
          opt.innerText = templateOptions[j].name;
          ddl.appendChild(opt);
        }
      }
    }

    function emitResult(value) {
      document.title = 'RESULT::' + SESSION_TOKEN + '::' + encodeURIComponent(value);
    }

    function cancelAction() {
      try {
        if (window.external && typeof window.external.setResult !== 'undefined') return window.external.setResult('');
        if (window.uipath && typeof window.uipath.setResult !== 'undefined') return window.uipath.setResult('');
      } catch (e) {}
      emitResult('');
    }

    function submit() {
      if (!currentMode) return alert('Please select a mode.');
      var selected = [];
      var checks = document.getElementsByName('jobId');
      for (var i = 0; i < checks.length; i++) if (checks[i].checked) selected.push(checks[i].value);
      if (!selected.length) return alert('Please select at least one job vacancy.');
      var emails = '';
      if (currentMode === 'Manual') {
        var area = document.getElementById('emailList');
        emails = area ? area.value : '';
        if (!emails || !emails.trim()) return alert('Please enter recipient emails.');
      }
      var template = document.getElementById('templateSelect').value;
      if (!template) return alert('Please select a template.');
      var result = JSON.stringify({ mode: currentMode, jobs: selected.join(';'), emails: emails, template: template });
      try {
        if (window.external && typeof window.external.setResult !== 'undefined') return window.external.setResult(result);
        if (window.uipath && typeof window.uipath.setResult !== 'undefined') return window.uipath.setResult(result);
      } catch (e) {}
      emitResult(result);
    }
  </script>
</body>
</html>
