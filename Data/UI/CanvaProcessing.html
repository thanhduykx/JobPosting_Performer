<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva Automation Processing</title>
    <style>
        :root { 
            --primary: #ffd700; 
            --bg: #90c2d1; 
            --card: #fff; 
            --text: #111827; 
            --muted: #334155; 
        }
        body { 
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        .container { 
            width: 100%; 
            max-width: 400px; 
            background: var(--card); 
            border: 8px solid #fff; 
            border-radius: 24px; 
            padding: 40px; 
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .loader {
            width: 70px;
            height: 70px;
            border: 6px solid #f1f5f9;
            border-top: 6px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { 
            margin: 0; 
            font-size: 32px; 
            font-weight: 900; 
            text-transform: uppercase; 
            color: #0f172a; 
            letter-spacing: -1px;
        }
        p { color: var(--muted); margin: 10px 0 25px; font-size: 14px; line-height: 1.5; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f1f5f9;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            position: absolute;
            height: 100%;
            width: 40%;
            background: var(--primary);
            border-radius: 10px;
            animation: move 1.5s infinite ease-in-out;
        }
        @keyframes move {
            0% { left: -40%; }
            100% { left: 100%; }
        }
        .status {
            margin-top: 15px;
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h2 id="task-title">Processing</h2>
        <p>Robot is communicating with Canva API to generate high-quality posters...</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <div class="status" id="status-text">INITIALIZING...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const task = urlParams.get('task');
        if (task) {
            document.getElementById('task-title').innerText = task;
            document.getElementById('status-text').innerText = "Working on " + task + "...";
        }

        const SESSION_ID = urlParams.get('session') || 'default';
        document.title = "PROCESSING::" + SESSION_ID;
    </script>
</body>
</html>
