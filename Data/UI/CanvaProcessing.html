<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva Automation Processing</title>
    <style>
        @font-face {
            font-family: 'BR Omega';
            src: url('../Fonts/BROmega-Regular-BF6556cee4dd400.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'BR Omega';
            src: url('../Fonts/BROmega-Bold-BF6556cee4cf0f3.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }
        :root { 
            --primary: #ffd700; 
            --bg: #90c2d1; 
            --card: #fff; 
            --text: #111827; 
            --muted: #334155; 
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            font-family: 'BR Omega', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        .container { 
            width: 100%; 
            max-width: 400px; 
            background: var(--card); 
            border: 8px solid #fff; 
            border-radius: 24px; 
            padding: 40px; 
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .loader {
            width: 70px;
            height: 70px;
            border: 6px solid #f1f5f9;
            border-top: 6px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { 
            margin: 0; 
            font-size: 32px; 
            font-weight: 900; 
            text-transform: uppercase; 
            color: #0f172a; 
            letter-spacing: -1px;
        }
        p { color: var(--muted); margin: 10px 0 25px; font-size: 14px; line-height: 1.5; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f1f5f9;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            position: absolute;
            height: 100%;
            width: 40%;
            background: var(--primary);
            border-radius: 10px;
            animation: move 1.5s infinite ease-in-out;
        }
        @keyframes move {
            0% { left: -40%; }
            100% { left: 100%; }
        }
        .status {
            margin-top: 15px;
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .actions {
            margin-top: 18px;
            display: flex;
            justify-content: center;
        }
        .btn-cancel {
            border: none;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 13px;
            font-weight: 700;
            background: #e2e8f0;
            color: #334155;
            cursor: pointer;
        }
    </style>
    <script>
        let isFinishing = false;
        (function () {
            function forceMaximize() {
                try {
                    window.moveTo(0, 0);
                    window.resizeTo(screen.availWidth, screen.availHeight);
                    if (window.outerWidth < screen.availWidth - 30 || window.outerHeight < screen.availHeight - 30) {
                        window.moveTo(0, 0);
                        window.resizeTo(screen.width, screen.height);
                    }
                } catch (e) { }
            }
            window.addEventListener('load', function () {
                setTimeout(forceMaximize, 50);
                setTimeout(forceMaximize, 300);
            });
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h2 id="task-title">Processing</h2>
        <p id="task-desc">The system is currently generating high-quality posters via Canva...</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <div class="status" id="status-text">INITIALIZING...</div>
        <div class="actions">
            <button class="btn-cancel" onclick="cancelFlow()">Cancel</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const task = urlParams.get('task');
        const titleEl = document.getElementById('task-title');
        const statusEl = document.getElementById('status-text');
        const descEl = document.getElementById('task-desc');
        if (task) {
            titleEl.innerText = task;
            const t = task.toLowerCase();
            if (t.includes('approval')) {
                descEl.innerText = "Please wait while the system is checking Gmail’s decision.";
                statusEl.innerText = "Checking approval response...";
            } else if (t.includes('sending')) {
                titleEl.innerText = "SENDING EMAILS";
                descEl.innerText = "The system is now sending emails to all approved recipients.";
                statusEl.innerText = "Sending emails...";
            } else {
                statusEl.innerText = "Working on " + task + "...";
            }
        }

        const SESSION_ID = urlParams.get('session') || 'default';
        document.title = "PROCESSING::" + SESSION_ID;

        // Self-close sentinel. The robot writes ../Temp/close_<sid>.png when
        // processing is done. We poll with an <Image> (which works for file://
        // sibling paths); when the image loads successfully, close the window.
        // This avoids relying on the robot forcibly killing the Edge process,
        // which fails when window-title detection is broken (Teams share etc.).
        (function () {
            const sentinelUrl = '../Temp/close_' + SESSION_ID + '.png';
            let closed = false;
            function doSelfClose() {
                if (closed) return;
                closed = true;
                isFinishing = true;
                try { window.close(); } catch (_) { }
                setTimeout(function () {
                    try {
                        document.body.innerHTML =
                            '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#444">' +
                            '<h2>Processing complete. You can close this window.</h2>' +
                            '</div>';
                    } catch (_) { }
                }, 600);
            }
            setInterval(function () {
                if (closed) return;
                const probe = new Image();
                probe.onload = doSelfClose;
                // Cache-bust so we always hit disk.
                probe.src = sentinelUrl + '?t=' + Date.now();
            }, 500);
        })();

        // Decision sentinel. Approval gate writes one of these files:
        // - ../Temp/approved_<sid>.png
        // - ../Temp/denied_<sid>.png
        // When detected, we navigate to the decision page in the SAME window.
        (function () {
            const approvedUrl = '../Temp/approved_' + SESSION_ID + '.png';
            const deniedUrl = '../Temp/denied_' + SESSION_ID + '.png';
            let navigated = false;
            function go(page) {
                if (navigated) return;
                navigated = true;
                isFinishing = true;
                try {
                    window.location.replace(page + '?session=' + encodeURIComponent(SESSION_ID) + '&t=' + Date.now());
                } catch (_) {
                    try { window.location.href = page; } catch (_) { }
                }
            }
            setInterval(function () {
                if (navigated || isFinishing) return;
                const a = new Image();
                a.onload = function () { go('CanvaApprovalApproved.html'); };
                a.src = approvedUrl + '?t=' + Date.now();

                const d = new Image();
                d.onload = function () { go('CanvaApprovalDenied.html'); };
                d.src = deniedUrl + '?t=' + Date.now();
            }, 500);
        })();

        function cancelFlow() {
            const confirmed = confirm("You chose Cancel while processing. The program will stop now. Are you sure?");
            if (confirmed) {
                isFinishing = true;
                document.title = "RESULT::" + SESSION_ID + "::CANCEL";
                try { window.close(); } catch (_) { }
            }
        }
    </script>
</body>
</html>
