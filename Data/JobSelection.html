<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Jobs</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
            margin: 0; padding: 20px;
            display: flex; justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 500px;
        }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .job-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .job-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }
        .job-item:hover { background: #f9f9f9; }
        .job-item input { margin-right: 15px; transform: scale(1.2); cursor: pointer; }
        .job-item label { cursor: pointer; flex-grow: 1; color: #34495e; }
        
        button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #2980b9; }
        
        .all-btn {
            background: #ecf0f1;
            color: #7f8c8d;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Select Job Openings</h2>
        <p>Pick one or more jobs to promote in this email batch:</p>
        
        <button class="all-btn" onclick="toggleAll()">Select All / Deselect All</button>
        
        <div id="jobList" class="job-list">
            <!-- Jobs will be injected here -->
        </div>
        
        <button onclick="submitSelection()">Confirm Selection</button>
    </div>

    <script>
        // Use URL parameters to get the jobs list passed from UiPath
        const urlParams = new URLSearchParams(window.location.search);
        const jobsString = urlParams.get('jobs') || "";
        const jobs = jobsString.split(';').filter(j => j.length > 0 && j !== 'ALL');
        
        const listContainer = document.getElementById('jobList');
        
        jobs.forEach((job, index) => {
            const div = document.createElement('div');
            div.className = 'job-item';
            div.innerHTML = `
                <input type="checkbox" id="job_${index}" value="${job}">
                <label for="job_${index}">${job}</label>
            `;
            listContainer.appendChild(div);
        });

        function toggleAll() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
        }

        function submitSelection() {
            const selected = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
                                  .map(cb => cb.value);
            
            if (selected.length === 0) {
                alert("Please select at least one job.");
                return;
            }
            
            // Return selected jobs joined by semicolon
            window.external.setResult(selected.join(';'));
        }
    </script>
</body>
</html>
