<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'BR Omega';
            src: url('../../Data/Fonts/BROmega-Regular-BF6556cee4dd400.otf') format('opentype');
            font-weight: 400; font-style: normal;
        }
        @font-face {
            font-family: 'BR Omega';
            src: url('../../Data/Fonts/BROmega-Medium-BF6556cee4bc2e2.otf') format('opentype');
            font-weight: 500; font-style: normal;
        }
        @font-face {
            font-family: 'BR Omega';
            src: url('../../Data/Fonts/BROmega-Bold-BF6556cee4cf0f3.otf') format('opentype');
            font-weight: 700; font-style: normal;
        }
        body,
        table,
        td,
        div,
        span {
            font-family: 'BR Omega', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            font-size: 18px;
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f4f4;">

    <table width="100%" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">

                <table width="800" height="450" border="0" cellpadding="0" cellspacing="0" style="background-image: url('https://lh3.googleusercontent.com/u/0/d/1PA7p0gAuOmJHpLHdz1XAr32CxFYg7HI3'); 
                              background-size: 800px 450px; 
                              background-repeat: no-repeat;
                              background-color: #005696;">
                    <tr>
                        <td valign="top" style="padding-top: 85px; padding-left: 20px; padding-right: 250px;">

                            <div
                                style="font-family: 'Arial Black', Impact, sans-serif; font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); padding-left: 70px; margin-bottom: 5px;">
                                {{Role}}
                            </div>

                            <div
                                style="height: 85px; overflow: hidden; line-height: 1.4; font-size: 22px; padding-top: 10px;">
                                {{Qualifications}}
                            </div>

                            <div style="margin-top: -8px; padding-left: 110px; font-weight: bold;">
                                {{CareerLevel}}
                            </div>

                            <div style="margin-top: 8px; padding-left: 120px; font-weight: bold;">
                                {{WorkLocation}}
                            </div>

                            <div style="margin-top: 0px; padding-left: 130px; font-weight: bold;">
                                {{WorkSchedule}}
                            </div>

                            <div style="margin-top: 0px; padding-left: 110px; font-weight: bold;">
                                {{WorkSetup}}
                            </div>

                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>

</html>
