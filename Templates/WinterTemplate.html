<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>FPT Software Recruitment - Winter</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    table {
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
  </style>
</head>

<body>
  <!-- Wrapping table centers everything -->
  <table width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#f4f6f9" style="background-color: #f4f6f9;">
    <tr>
      <td align="center" valign="top" style="padding: 20px 0;">

        <!-- Main Container: Fixed aspect ratio/width so the background aligns perfectly -->
        <table width="1000" height="562" border="0" cellpadding="0" cellspacing="0"
          background="https://drive.google.com/uc?export=view&id=11RhGOV3JR0fMXUjzjFDIYGvgwOnRpLer"
          style="width: 1000px; max-width: 1000px; height: 562px; background-image: url('https://drive.google.com/uc?export=view&id=11RhGOV3JR0fMXUjzjFDIYGvgwOnRpLer'); background-size: cover; background-position: center top; background-repeat: no-repeat; background-color: #1a293b;">

          <!-- Spacer row to push text down to where the glass boxes start -->
          <!-- In Image 2, the boxes start slightly below the center, roughly 45% down -->
          <tr>
            <td colspan="6" height="300" style="height: 300px; line-height: 0; font-size: 0;">&nbsp;</td>
          </tr>

          <!-- Data row corresponding to the 4 boxes -->
          <tr>
            <!-- Left margin: 6% of 1000 = 60px -->
            <td width="60" style="width: 60px;">&nbsp;</td>

            <!-- Box 1: ROLE -->
            <td width="160" valign="top"
              style="width: 160px; color: #ffffff; font-size: 15.5px; font-weight: 500; font-family: 'Segoe UI', Arial, sans-serif; padding-top: 10px; padding-right: 15px; padding-left: 10px; line-height: 1.5;">
              {{Role}}
            </td>

            <!-- Box 2: QUALIFICATIONS -->
            <td width="190" valign="top"
              style="width: 190px; color: #ffffff; font-size: 14.5px; font-weight: 400; font-family: 'Segoe UI', Arial, sans-serif; padding-top: 10px; padding-right: 15px; padding-left: 15px; line-height: 1.5;">
              {{Qualifications}}
            </td>

            <!-- Box 3: WORK SET-UP -->
            <td width="170" valign="top"
              style="width: 170px; color: #ffffff; font-size: 14.5px; font-weight: 400; font-family: 'Segoe UI', Arial, sans-serif; padding-top: 10px; padding-right: 15px; padding-left: 5px; line-height: 1.5;">
              Location: {{WorkLocation}}<br />
              Setup: {{WorkSetup}}<br />
              Schedule: {{WorkSchedule}}
            </td>

            <!-- Box 4: CAREER LEVEL -->
            <td width="170" valign="top"
              style="width: 170px; color: #ffffff; font-size: 15.5px; font-weight: 500; font-family: 'Segoe UI', Arial, sans-serif; padding-top: 10px; padding-right: 15px; padding-left: 15px; line-height: 1.5;">
              {{CareerLevel}}
            </td>

            <!-- Right margin (Girl holding cup) -->
            <td width="250" style="width: 250px;">&nbsp;</td>
          </tr>

          <!-- Bottom spacer to maintain image ratio -->
          <tr>
            <td colspan="6" height="60" style="height: 60px; line-height: 0; font-size: 0;">&nbsp;</td>
          </tr>

        </table>



      </td>
    </tr>
  </table>
</body>

</html>
